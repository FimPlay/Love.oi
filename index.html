<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для моей кисули ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:

linear-gradient(
180deg,
#ffd1e6,
#fff1f8
);

}


.container{

width:90%;

max-width:430px;

background:

rgba(255,255,255,.55);

backdrop-filter:blur(15px);

border-radius:30px;

padding:30px;

text-align:center;

box-shadow:

0 20px 50px rgba(255,80,150,.25);

}


.heart{

font-size:90px;

animation:

pulse 1.2s infinite;

}


@keyframes pulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.15);

}

}



h1{

margin-top:15px;

font-size:32px;

color:#ff4f98;

}



.text{

margin-top:20px;

font-size:18px;

line-height:1.7;

color:#d94282;

}



button{

margin-top:25px;

width:100%;

padding:18px;

border:none;

border-radius:20px;

background:

linear-gradient(
45deg,
#ff579e,
#ff91c7
);

color:white;

font-size:18px;

font-weight:bold;

}



.timer{

margin-top:20px;

color:#ff4f98;

font-weight:bold;

}



.modal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

display:none;

justify-content:center;

align-items:center;

background:

rgba(255,170,210,.4);

backdrop-filter:blur(10px);

}



.box{

background:white;

padding:30px;

border-radius:30px;

width:85%;

max-width:360px;

text-align:center;

animation:show .4s;

}



@keyframes show{

from{

transform:scale(.5);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}



.message{

font-size:20px;

color:#ff4f98;

line-height:1.6;

}



.heartFly{

position:fixed;

bottom:-20px;

animation:

fly 5s linear forwards;

}



@keyframes fly{

from{

transform:translateY(0);

opacity:1;

}

to{

transform:translateY(-120vh);

opacity:0;

}

}



</style>

</head>


<body>


<div class="container">


<div class="heart">

❤️

</div>


<h1>

Для моей кисули

</h1>


<div class="text">

Кисуль 🥹❤️

<br><br>

Я сделал для тебя маленький уголок счастья.

Каждый час тебя будет ждать новое пожелание.

Пусть оно подарит тебе улыбку 💖

</div>


<button onclick="openWish()">

💌 Открыть пожелание

</button>


<div class="timer" id="timer">

Можно открыть сейчас ❤️

</div>


</div>



<div class="modal" id="modal">


<div class="box">


<div class="message" id="message"></div>


<button onclick="closeModal()">

Закрыть ❤️

</button>


</div>


</div>



<script>


const wishes=[

"🌸 Пусть твой день будет самым красивым.",

"💖 Улыбнись, потому что ты самая прекрасная.",

"☀️ Желаю тебе отличного настроения.",

"🥰 Помни, что я тебя очень люблю.",

"🌷 Пусть сегодня будет много радости.",

"✨ Пусть исполнится маленькая мечта.",

"💕 Спасибо, что ты есть у меня.",

"🧸 Отправляю тебе самые тёплые объятия.",

"💋 Лови мой виртуальный поцелуй.",

"🌈 Пусть вокруг тебя будут только хорошие люди.",

"🍓 Желаю тебе сладкого дня.",

"❤️ Ты моё самое большое счастье."

];


let data = JSON.parse(

localStorage.getItem("love")

)

||

{

time:0,

index:0

};



function save(){

localStorage.setItem(

"love",

JSON.stringify(data)

);

}



function openWish(){


let now=Date.now();


if(

now-data.time < 3600000

&&

data.time!==0

){

let min=Math.ceil(

(3600000-(now-data.time))

/60000

);


document.getElementById("message").innerHTML=

"🥹 Следующее пожелание через "

+min+

" минут ❤️";


document.getElementById("modal").style.display="flex";


return;

}


document.getElementById("message").innerHTML=

wishes[data.index];


document.getElementById("modal").style.display="flex";


data.index++;


if(data.index>=wishes.length){

data.index=0;

}


data.time=now;


save();


hearts();


}

function closeModal(){

document.getElementById("modal").style.display="none";

}



function hearts(){

for(let i=0;i<25;i++){

let heart=document.createElement("div");

heart.className="heartFly";

heart.innerHTML=

Math.random()>0.5

?"❤️"

:"💖";


heart.style.left=

Math.random()*100+"vw";


heart.style.fontSize=

(20+Math.random()*25)+"px";


heart.style.animationDuration=

(3+Math.random()*4)+"s";


document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},6000);

}

}




function updateTimer(){


if(data.time===0){

return;

}


let left=

3600000-(Date.now()-data.time);



if(left<=0){


document.getElementById("timer").innerHTML=

"💖 Новое пожелание доступно!";


return;

}



let minutes=

Math.floor(left/60000);


let seconds=

Math.floor(

(left%60000)/1000

);



document.getElementById("timer").innerHTML=

"Следующее пожелание через: "

+minutes+

" мин "

+seconds+

" сек ❤️";

}



setInterval(updateTimer,1000);



updateTimer();




/* Первое красивое приветствие */


setTimeout(()=>{


if(!localStorage.getItem("hello")){


document.getElementById("message").innerHTML=

`

<div style="font-size:55px">

🥹❤️

</div>

<br>

Привет, кисуль.

<br><br>

Я сделал это маленькое место только для тебя.

<br><br>

Пусть каждый день у тебя будет повод улыбнуться 💖

`;


document.getElementById("modal").style.display="flex";


localStorage.setItem(

"hello",

"true"

);


}


},1200);





/* Больше плавающих сердечек */


setInterval(()=>{


let h=document.createElement("div");


h.className="heartFly";


h.innerHTML="💗";


h.style.left=

Math.random()*100+"vw";


h.style.fontSize="22px";


h.style.animationDuration="7s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},7000);



},1800);





/* Нажатие на сердце */


document.querySelector(".heart").onclick=function(){


hearts();


document.getElementById("message").innerHTML=

`

❤️❤️❤️

<br><br>

Секретик:

<br><br>

Ты самая любимая девочка.

<br>

Не забывай улыбаться 🥹

`;


document.getElementById("modal").style.display="flex";


};




</script>


</body>

</html>
